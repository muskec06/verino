# SPI2 with an SD card: the solver should pick the IO_MUX pins.
schema: verino-hw/1
module: esp32-s3-wroom-1-n8r8
uses: [wifi]

buses:
  spi2: {kind: spi, host: SPI2, sclk: {pin: GPIO12, origin: solver}, mosi: {pin: GPIO11, origin: solver}, miso: {pin: GPIO13, origin: solver}}

devices:
  sd: {part: sdcard, bus: spi2, cs: {pin: GPIO10, origin: solver}}
