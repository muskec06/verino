# Greenhouse controller: buses and devices, one UART pin locked by the schematic.
schema: verino-hw/1
module: esp32-s3-wroom-1-n8r8
uses: [wifi]

buses:
  i2c0: {kind: i2c, sda: {pin: GPIO2, origin: solver}, scl: {pin: GPIO4, origin: solver}, freq_hz: 400000, pullups: external_4k7}
  spi2: {kind: spi, host: SPI2, sclk: {pin: GPIO12, origin: solver}, mosi: {pin: GPIO11, origin: solver}, miso: {pin: GPIO13, origin: solver}}
  uart1:
    kind: uart
    tx: {pin: GPIO17, origin: schematic, locked: true}
    rx: {pin: GPIO7, origin: solver}
    baud: 9600

devices:
  env: {part: bme280, bus: i2c0, addr: 0x76}
  sd: {part: sdcard, bus: spi2, cs: {pin: GPIO10, origin: solver}}
  probe: {part: ds18b20, kind: onewire, pin: {pin: GPIO5, origin: solver}}
  status: {part: ws2812, kind: gpio, pin: {pin: GPIO8, origin: solver}}
  pump: {part: grove-relay, kind: gpio, pin: {pin: GPIO6, origin: solver}}
  soil: {part: analog_in, kind: adc, pin: {pin: GPIO1, origin: solver}}
