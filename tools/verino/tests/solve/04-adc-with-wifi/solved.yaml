# Two analog inputs while Wi-Fi is on: ADC1 pins only (ADC2 is shared with Wi-Fi).
schema: verino-hw/1
module: esp32-s3-wroom-1-n8r8
uses: [wifi]

devices:
  soil: {part: analog_in, kind: adc, pin: {pin: GPIO1, origin: solver}}
  light: {part: analog_in, kind: adc, pin: {pin: GPIO2, origin: solver}}
