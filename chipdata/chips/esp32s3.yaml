manual:
  strapping:
    GPIO0:
      function: boot_mode
      default: pull_up
      boot_safe: high
      on_violation: "LOW at reset selects Joint Download Boot (with GPIO46 low); the application does not start."
      severity: error
      provenance:
        kind: datasheet
        source: esp32s3-datasheet@2.2
        ref: "Table 3-1 (p. 32); Table 3-3 (p. 33)"
    GPIO3:
      function: jtag_signal_source
      default: floating
      boot_safe: any
      on_violation: "Sampled only when EFUSE_STRAP_JTAG_SEL is burnt; it then selects the JTAG signal source. The pin has no internal pull, so drive it externally if that eFuse is set."
      severity: info
      provenance:
        kind: datasheet
        source: esp32s3-datasheet@2.2
        ref: "Table 3-1 (p. 32); Section 3.4 and Table 3-5 (pp. 34-35)"
    GPIO45:
      function: vdd_spi_voltage
      default: pull_down
      boot_safe: low
      on_violation: "HIGH at reset selects 1.8 V VDD_SPI (while EFUSE_VDD_SPI_FORCE is 0); a 3.3 V flash/PSRAM then fails and the board does not boot."
      severity: error
      provenance:
        kind: datasheet
        source: esp32s3-datasheet@2.2
        ref: "Table 3-1 (p. 32); Table 3-4 (p. 34)"
    GPIO46:
      function: boot_mode_and_rom_messages
      default: pull_down
      boot_safe: low
      on_violation: "With GPIO0 LOW, GPIO46 HIGH is not a listed boot mode, so download mode does not work. GPIO46 also takes part in ROM message printing control."
      severity: warning
      provenance:
        kind: datasheet
        source: esp32s3-datasheet@2.2
        ref: "Section 3 (p. 32); Table 3-1 (p. 32); Table 3-3 (p. 33)"
  spi_flash_pins:
    pins: {GPIO26: SPICS1, GPIO27: SPIHD, GPIO28: SPIWP, GPIO29: SPICS0, GPIO30: SPICLK, GPIO31: SPIQ, GPIO32: SPID}
    note: "SPI0/1 interface to in-package flash and PSRAM, or recommended for off-package flash and PSRAM; not recommended for other uses."
    provenance:
      kind: datasheet
      source: esp32s3-datasheet@2.2
      ref: "Table 2-4 (pp. 21-22); Section 2.3.5 (p. 26); Table 2-14 (p. 31)"
  octal_spi_pins:
