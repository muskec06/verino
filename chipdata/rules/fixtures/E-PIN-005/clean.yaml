# E-PIN-005: must not trigger (every pin chosen).
schema: verino-hw/1
module: esp32-s3-wroom-1-n8r8
uses: []

buses:
  i2c0:
    kind: i2c
    sda: {pin: GPIO1, origin: solver}
    scl: {pin: GPIO2, origin: solver}

devices:
  env: {part: bme280, bus: i2c0, addr: 0x76}
  probe: {part: ds18b20, kind: onewire, pin: {pin: GPIO4, origin: solver}}
